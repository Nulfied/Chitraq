# Continuous integration.
#
# There is no install step because there is nothing to install: Chitraq has no
# dependencies and `node:sqlite` ships with Node. That is also why the last job
# exists — the zero-dependency claim is made in the README, in CONTRIBUTING.md
# and on the landing page, so something should fail when it stops being true.
#
# Windows is in the matrix on purpose rather than for completeness. The one
# platform-specific crash found so far was a libuv assertion in recursive
# `fs.watch` that aborts the whole process on 8.3 short paths — the kind of
# thing only a real Windows runner catches.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests · node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # All three of the platforms the README claims support for, because a
      # claim nothing checks is a claim that quietly stops being true. The
      # one platform-specific crash found so far was a libuv assertion in
      # recursive fs.watch on Windows short paths.
      #
      # One platform failing should still report the others, rather than
      # cancelling them and hiding whether the problem is platform-specific.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['24']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Node and SQLite versions
        # Recorded in the log because `node:sqlite` is the one thing this
        # project genuinely depends on, and "which SQLite was that?" is
        # otherwise unanswerable when a future runner image changes it.
        run: |
          node --version
          node -e "const {DatabaseSync}=require('node:sqlite');const db=new DatabaseSync(':memory:');console.log('sqlite', db.prepare('select sqlite_version() v').get().v);"

      - name: Test
        # No models are installed here, and that is the point: the
        # deterministic provider is the floor the whole system stands on, so
        # the suite has to pass with nothing else present.
        #
        # The failure is echoed as a workflow error as well as being in the log,
        # because GitHub now asks people to sign in before reading a job log —
        # annotations stay readable to anyone looking at the run.
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # The whole tail, not a clever pattern. Node's reporter differs
            # between a TTY and a pipe, and a grep written for the wrong one
            # reports "no failing test" about a run full of them — which is
            # exactly what happened the first time this was written.
            echo "--- last 80 lines ---"
            tail -80 test-output.txt
            # The failing test names, by the mark the reporter actually
            # prints. Earlier attempts matched TAP syntax and then a
            # section header, and both reported nothing about a run full
            # of failures. Artifacts and logs need a login; annotations do
            # not, so the names belong here.
            names=$(grep -a '✖' test-output.txt | head -12 | tr '\n' '~')
            # Not anchored with `^.` — the reporter prefixes these with a
            # multibyte glyph, which one `.` does not match in byte mode.
            counts=$(grep -aE '(tests|pass|fail) [0-9]+$' test-output.txt | tr '\n' ' ')
            echo "::error::${counts} :: ${names:-no marked failures; exit was $code}"
          fi
          exit "$code"

      - name: Documented test count matches the suite
        # The count was stated in five places and four of them were stale —
        # the README and the landing page said 326 while STATUS.md said 352.
        # Nobody was careless; the number is just the kind of fact that goes
        # out of date the moment a test is added, which is every commit.
        #
        # Reads the count out of the run that already happened rather than
        # running the suite again. Linux only: the documents are the same on
        # every platform, so checking them three times says nothing new.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # Anchored to the end of the line, not the start: the reporter
          # prefixes the summary with a multibyte glyph, and `^.` in byte
          # mode matches one third of it. That mistake has now been made
          # twice in this file, in two different steps.
          count=$(grep -aoE 'tests [0-9]+$' test-output.txt | grep -oE '[0-9]+' | head -1)
          if [ -z "$count" ]; then
            echo "::error::Could not read a test count from the run output."
            exit 1
          fi
          node tools/check-test-count.mjs "$count" || {
            echo "::error::Documentation states a test count that is not $count. Run: node tools/check-test-count.mjs $count --fix"
            exit 1
          }

      - name: API reference matches the routes
        # docs/API.md is generated from the server's own route table. This
        # fails when a route is added without a description, when a
        # description outlives its route, or when the file was not
        # regenerated — so the reference cannot quietly describe an API that
        # is not the one being served.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          node tools/api-reference.mjs --check || {
            echo "::error::docs/API.md is out of date or a route is undocumented. Run: node tools/api-reference.mjs"
            exit 1
          }

      - name: Keep the output when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: test-output.txt
          retention-days: 7

  dependencies:
    name: still has no dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check package.json
        run: |
          node -e "
            const pkg = require('./package.json');
            const deps = Object.keys(pkg.dependencies ?? {});
            const dev  = Object.keys(pkg.devDependencies ?? {});
            if (deps.length || dev.length) {
              console.error('Chitraq declares zero dependencies. Found:');
              for (const d of [...deps, ...dev]) console.error('  ' + d);
              console.error('');
              console.error('If this is deliberate, say why in the pull request');
              console.error('and change this check in the same commit.');
              process.exit(1);
            }
            console.log('zero dependencies, as advertised');
          "
